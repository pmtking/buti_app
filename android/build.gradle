buildscript {
  repositories {
    // آینه‌های علی‌یون برای دور زدن فیلترینگ (اولویت با آنهاست)
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    
    google()
    mavenCentral()
  }
  dependencies {
    // نسخه را به‌صورت صریح و کامل نوشتم
    classpath('com.android.tools.build:gradle:8.5.0')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/google' }
    
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// 🎯 مقادیر SDK که app/build.gradle انتظار دارد (از RN 0.81 / Expo SDK 54)
ext {
  minSdkVersion = 24
  targetSdkVersion = 36
  compileSdkVersion = 36
  // ⚠️ build-tools 36 از آینه‌ها در دسترس نیست — از 35.0.0 استفاده میکنیم (سازگار)
  buildToolsVersion = "35.0.0"
  ndkVersion = "27.1.12297006"
}
