pluginManagement {
  repositories {
    // آینه‌های علی‌یون برای عبور از فیلترینگ (الویت اول)
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    
    google()
    mavenCentral()
  }
  resolutionStrategy {
    eachPlugin {
      if (requested.id.id == "com.android.application") {
        useModule("com.android.tools.build:gradle:8.5.0")
      } else if (requested.id.id == "com.android.library") {
        useModule("com.android.tools.build:gradle:8.5.0")
      }
    }
  }
}

rootProject.name = 'buti'

dependencyResolutionManagement {
  repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/google' }
    
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply from: new File(["node", "--print", "require.resolve('expo/package.json')"].execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle");
useExpoModules()

// 🎯 کاتالوگ نسخه‌ها — معادل useExpoVersionCatalog بدون نیاز به پلاگین settings
// نسخه‌ها از node_modules/react-native/gradle/libs.versions.toml خوانده میشوند
def rnPkgDir = new File(["node", "--print",
    "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).parentFile
def rnCatalogFile = new File(rnPkgDir, "gradle/libs.versions.toml")
dependencyResolutionManagement {
    versionCatalogs {
        expoLibs {
            from files(rnCatalogFile)
            version("buildTools", "35.0.0")
            version("minSdk", "24")
            version("compileSdk", "36")
            version("targetSdk", "36")
        }
    }
}

include ':app'
includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json')"].execute(null, rootDir).text.trim()).getParentFile())
