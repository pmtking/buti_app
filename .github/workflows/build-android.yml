name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Expo CLI
        run: npm install -g expo-cli

      # ========== بازسازی کامل پوشه‌ی android ==========
      - name: Prebuild (force recreate android folder)
        run: npx expo prebuild --clean

      # ========== تنظیم compileSdk (اگر هنوز خطا داد) ==========
      - name: Fix compileSdk if missing
        run: |
          if ! grep -q "compileSdk" android/app/build.gradle; then
            sed -i '/android {/a \ \ \ \ compileSdk 34' android/app/build.gradle
          fi

      # ========== مخازن علی‌یون (برای دور زدن تحریم) ==========
      - name: Add Aliyun mirrors
        run: |
          grep -q "aliyun" android/build.gradle || sed -i '/repositories {/a \ \ \ \ maven { url "https://maven.aliyun.com/repository/public" }\n\ \ \ \ maven { url "https://maven.aliyun.com/repository/google" }' android/build.gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7